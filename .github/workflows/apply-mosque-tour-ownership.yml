name: Apply Mosque Tour Ownership Protection

on:
  push:
    paths:
      - '.github/scripts/apply-mosque-tour-ownership.js'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply ownership protection patch
        run: node .github/scripts/apply-mosque-tour-ownership.js
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Verify backend syntax
        run: node --check src/routes/mosques.routes.js
      - name: Remove temporary patch files
        run: rm -f .github/scripts/apply-mosque-tour-ownership.js .github/workflows/apply-mosque-tour-ownership.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/mosques.routes.js .github/scripts/apply-mosque-tour-ownership.js .github/workflows/apply-mosque-tour-ownership.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Protect mosque field tour ownership'
          git push origin main

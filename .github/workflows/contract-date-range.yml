name: Contract date range fields

on:
  push:
    paths:
      - '.github/workflows/contract-date-range.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch schema and records API
        shell: python
        run: |
          from pathlib import Path

          schema = Path('prisma/schema.prisma')
          s = schema.read_text(encoding='utf-8')

          models = ['LeasedLandOut','LeasedLandIn','LeasedBuildingOut','LeasedBuildingIn']
          for model in models:
              start = s.index(f'model {model} {{')
              end = s.index('\n}', start)
              block = s[start:end]
              additions = []
              fields = [
                  ('contractStartDate', 'DateTime?'),
                  ('contractStartDateOriginal', 'String?'),
                  ('contractStartDateType', 'String?   @default("gregorian")'),
                  ('contractEndDate', 'DateTime?'),
                  ('contractEndDateOriginal', 'String?'),
                  ('contractEndDateType', 'String?   @default("gregorian")'),
              ]
              for name, typ in fields:
                  if name not in block:
                      additions.append(f'  {name:<25} {typ}')
              if additions:
                  insert_at = s.index('\n}', start)
                  s = s[:insert_at] + '\n' + '\n'.join(additions) + s[insert_at:]
          schema.write_text(s, encoding='utf-8')

          routes = Path('src/routes/records.routes.js')
          r = routes.read_text(encoding='utf-8')

          replacements = {
            "'leased-lands-out': ['tenant','contractNumber','contractStartDate','contractStartDateType','contractDuration','plotNumber','planNumber','area','location','coordinates','rentAmount','notes','createdBy'],": "'leased-lands-out': ['tenant','contractNumber','contractStartDate','contractStartDateOriginal','contractStartDateType','contractEndDate','contractEndDateOriginal','contractEndDateType','contractDuration','plotNumber','planNumber','area','location','coordinates','rentAmount','notes','createdBy'],",
            "'leased-lands-in': ['owner','contractNumber','contractDuration','propertyDescription','area','location','coordinates','rentAmount','notes','createdBy'],": "'leased-lands-in': ['owner','contractNumber','contractStartDate','contractStartDateOriginal','contractStartDateType','contractEndDate','contractEndDateOriginal','contractEndDateType','contractDuration','propertyDescription','area','location','coordinates','rentAmount','notes','createdBy'],",
            "'leased-buildings-out': ['tenant','contractNumber','buildingNumber','planNumber','locationName','area','city','district','coordinates','rentAmount','notes','createdBy'],": "'leased-buildings-out': ['tenant','contractNumber','contractStartDate','contractStartDateOriginal','contractStartDateType','contractEndDate','contractEndDateOriginal','contractEndDateType','buildingNumber','planNumber','locationName','area','city','district','coordinates','rentAmount','notes','createdBy'],",
            "'leased-buildings-in': ['owner','contractNumber','buildingNumber','locationName','area','region','city','coordinates','rentAmount','notes','createdBy'],": "'leased-buildings-in': ['owner','contractNumber','contractStartDate','contractStartDateOriginal','contractStartDateType','contractEndDate','contractEndDateOriginal','contractEndDateType','buildingNumber','locationName','area','region','city','coordinates','rentAmount','notes','createdBy'],",
          }
          for old, new in replacements.items():
              r = r.replace(old, new)

          r = r.replace("  'contractStartDate',\n]);", "  'contractStartDate',\n  'contractEndDate',\n]);")

          old_parser = '''const parseFlexibleDate = (value, type = 'gregorian') => {\n  if (!value) return null;\n  if (type === 'hijri') {\n    const match = String(value).trim().match(/^(\\d{4})[\\/-](\\d{1,2})[\\/-](\\d{1,2})/);\n    if (!match) return null;\n    const year = Number(match[1]);\n    const month = Number(match[2]);\n    const day = Number(match[3]);\n    if (year < 1200 || year > 1700 || month < 1 || month > 12 || day < 1 || day > 30) return null;\n    return new Date(Date.UTC(year, month - 1, day, 12, 0, 0));\n  }\n  const parsed = new Date(value);\n  return Number.isNaN(parsed.getTime()) ? null : parsed;\n};'''

          new_parser = '''const hijriParts = (date) => {\n  const parts = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', {\n    year: 'numeric', month: 'numeric', day: 'numeric', timeZone: 'UTC'\n  }).formatToParts(date);\n  const get = (type) => Number(parts.find((part) => part.type === type)?.value);\n  return { year: get('year'), month: get('month'), day: get('day') };\n};\n\nconst hijriToGregorian = (year, month, day) => {\n  const roughYear = year + 579;\n  const center = Date.UTC(roughYear, Math.max(0, month - 1), Math.min(day, 28), 12, 0, 0);\n  for (let offset = -420; offset <= 420; offset += 1) {\n    const candidate = new Date(center + offset * 86400000);\n    const h = hijriParts(candidate);\n    if (h.year === year && h.month === month && h.day === day) return candidate;\n  }\n  return null;\n};\n\nconst parseFlexibleDate = (value, type = 'gregorian') => {\n  if (!value) return null;\n  if (type === 'hijri') {\n    const match = String(value).trim().match(/^(\\d{4})[\\/-](\\d{1,2})[\\/-](\\d{1,2})/);\n    if (!match) return null;\n    const year = Number(match[1]);\n    const month = Number(match[2]);\n    const day = Number(match[3]);\n    if (year < 1200 || year > 1700 || month < 1 || month > 12 || day < 1 || day > 30) return null;\n    return hijriToGregorian(year, month, day);\n  }\n  const parsed = new Date(value);\n  return Number.isNaN(parsed.getTime()) ? null : parsed;\n};'''
          if old_parser in r:
              r = r.replace(old_parser, new_parser)

          marker = "  if (resource === 'leased-lands-in') {"
          contract_map = '''  if (['leased-lands-out', 'leased-lands-in', 'leased-buildings-out', 'leased-buildings-in'].includes(resource)) {\n    for (const field of ['contractStartDate', 'contractEndDate']) {\n      const typeField = `${field}Type`;\n      const originalField = `${field}Original`;\n      const type = body[typeField] === 'hijri' ? 'hijri' : 'gregorian';\n      const original = body[originalField] || body[field] || null;\n      mapped[typeField] = type;\n      mapped[originalField] = original;\n      mapped[field] = original;\n    }\n  }\n\n'''
          if contract_map.strip() not in r:
              r = r.replace(marker, contract_map + marker)

          routes.write_text(r, encoding='utf-8')
      - name: Validate JavaScript
        run: node --check src/routes/records.routes.js
      - name: Commit changes
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/contract-date-range.yml
          git add prisma/schema.prisma src/routes/records.routes.js
          git commit -m "Add explicit contract start and end dates"
          git push

name: Fix Stage6 raw Drive import

on:
  push:
    branches: [fix/stage6-drive-download]

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage6-drive-download
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Add XLSX parser
        run: npm install xlsx@^0.18.5 --save
      - name: Patch Stage6 reader
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/services/accountingStage6Baseline.service.js')
          s = p.read_text()
          s = s.replace("import { google } from 'googleapis';\n", "import crypto from 'node:crypto';\nimport { google } from 'googleapis';\nimport XLSX from 'xlsx';\n", 1)
          old = '''const readStage6Spreadsheet = async () => {\n  const sheets = google.sheets({ version: 'v4', auth: getOAuthClient() });\n  const response = await sheets.spreadsheets.values.batchGet({\n    spreadsheetId: ACCOUNTING_STAGE6_SOURCE.spreadsheetId,\n    ranges: [ACCOUNTING_STAGE6_SOURCE.landRange, ACCOUNTING_STAGE6_SOURCE.buildingRange],\n    valueRenderOption: 'FORMATTED_VALUE',\n    dateTimeRenderOption: 'FORMATTED_STRING',\n  });\n  const [landRange, buildingRange] = response.data.valueRanges || [];\n  const items = stage6MatricesToItems({\n    landValues: landRange?.values || [],\n    buildingValues: buildingRange?.values || [],\n  });\n  const counts = validateStage6Items(items);\n  return { items, counts };\n};'''
          new = '''const readStage6Spreadsheet = async () => {\n  const drive = google.drive({ version: 'v3', auth: getOAuthClient() });\n  const response = await drive.files.get(\n    { fileId: ACCOUNTING_STAGE6_SOURCE.rawDriveFileId, alt: 'media' },\n    { responseType: 'arraybuffer' },\n  );\n  const buffer = Buffer.from(response.data);\n  const sha256 = crypto.createHash('sha256').update(buffer).digest('hex');\n  if (sha256 !== ACCOUNTING_STAGE6_SOURCE.originalFileSha256) {\n    throw new Error(`Stage 6 source hash mismatch. Expected ${ACCOUNTING_STAGE6_SOURCE.originalFileSha256}, received ${sha256}. No accounting data was replaced.`);\n  }\n\n  const workbook = XLSX.read(buffer, { type: 'buffer', cellDates: false, raw: false });\n  const landSheet = workbook.Sheets[ACCOUNTING_STAGE6_SOURCE.landSheet];\n  const buildingSheet = workbook.Sheets[ACCOUNTING_STAGE6_SOURCE.buildingSheet];\n  if (!landSheet || !buildingSheet) {\n    throw new Error('Stage 6 workbook is missing one or both required baseline sheets. No accounting data was replaced.');\n  }\n\n  const landValues = XLSX.utils.sheet_to_json(landSheet, {\n    header: 1,\n    range: 'A8:BQ23',\n    defval: '',\n    raw: false,\n  });\n  const buildingValues = XLSX.utils.sheet_to_json(buildingSheet, {\n    header: 1,\n    range: 'A8:CM632',\n    defval: '',\n    raw: false,\n  });\n  const items = stage6MatricesToItems({ landValues, buildingValues });\n  const counts = validateStage6Items(items);\n  return { items, counts, sha256 };\n};'''
          if old not in s:
              raise SystemExit('Stage6 reader block not found')
          s = s.replace(old, new, 1)
          s = s.replace("message: 'جاري قراءة آخر ملف Excel المراجع من Google Sheets.',", "message: 'جاري تنزيل آخر ملف Excel المراجع والتحقق من بصمته قبل الاستيراد.',", 1)
          p.write_text(s)
          PY
      - name: Verify backend
        run: |
          npx prisma generate
          npm test
          node --check src/services/accountingStage6Baseline.service.js
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/fix-stage6-drive-download.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json src/services/accountingStage6Baseline.service.js .github/workflows/fix-stage6-drive-download.yml
          git commit -m 'Read Stage6 baseline from raw Drive XLSX [skip ci]'
          git push

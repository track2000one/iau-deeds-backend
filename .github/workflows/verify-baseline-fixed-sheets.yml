name: Verify Baseline Fixed Sheets Backend
on:
  push:
    branches: [agent/accounting-baseline-fixed-sheets]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --check src/config/accountingBaselineSources.js
      - run: node --check src/routes/accounting-baseline-reset.routes.js

name: Apply accounting cycles integration

on:
  push:
    paths:
      - '.github/workflows/apply-accounting-cycles.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply integration patch
        run: python scripts/apply-accounting-cycles.py
      - name: Verify backend
        run: |
          npm ci
          npx prisma format
          npx prisma generate
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit integration
        run: |
          git config user.name 'OpenAI Project Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prisma/schema.prisma src/app.js src/server.js src/routes/accounting-transformation.routes.js src/services/accountingCycles.service.js
          git diff --cached --quiet && exit 0
          git commit -m 'feat: integrate accounting transformation data cycles'
          git push origin main

name: Verify Hierarchical Accounting Groups Backend

on:
  push:
    branches: [agent/hierarchical-accounting-groups]
  pull_request:
    branches: [main]

concurrency:
  group: verify-hierarchical-accounting-groups-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --check src/routes/accounting-hierarchy.routes.js
      - run: node --check src/app.js

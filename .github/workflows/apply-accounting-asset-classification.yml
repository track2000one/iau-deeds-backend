name: Apply accounting asset classification backend

on:
  push:
    paths:
      - '.github/workflows/apply-accounting-asset-classification.yml'

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch Prisma schema and app route
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          schema_path = Path('prisma/schema.prisma')
          schema = schema_path.read_text(encoding='utf-8')
          if 'model AccountingAssetClassificationVersion {' not in schema:
              schema += r'''

// ============================================================
// Accounting Transformation - Asset Classification & Coding Master Data
// ============================================================
model AccountingAssetClassificationVersion {
  id                  String   @id @default(cuid())
  versionLabel        String
  title               String   @default("دليل تصنيف وترميز الأصول")
  sourceFileName      String
  isCurrent           Boolean  @default(false)
  classificationCount Int      @default(0)
  usefulLifeCount     Int      @default(0)
  importedBy          String?
  importedAt          DateTime @default(now())
  notes               String?
  createdAt           DateTime @default(now())
  updatedAt           DateTime @updatedAt

  classifications AccountingAssetClassification[]
  usefulLives     AccountingAssetUsefulLife[]

  @@index([isCurrent])
  @@index([importedAt])
  @@index([versionLabel])
}

model AccountingAssetClassification {
  id                   String   @id @default(cuid())
  versionId            String
  level1Code           String
  level1Ar             String
  level1En             String?
  level2Code           String
  level2Ar             String
  level2En             String?
  level3Code           String
  level3Ar             String
  level3En             String?
  accountingGroupCode  String
  accountingGroupAr    String
  accountingGroupEn    String?
  accountingAssetCode  String
  assetCostAccountCode String?
  assetCostAccountName String?
  clearingAccountCode  String?
  clearingAccountName  String?
  lifecycleStatus      String?
  sourceRow            Int?
  createdAt            DateTime @default(now())

  version AccountingAssetClassificationVersion @relation(fields: [versionId], references: [id], onDelete: Cascade)

  @@index([versionId])
  @@index([level1Code])
  @@index([level2Code])
  @@index([level3Code])
  @@index([accountingGroupCode])
  @@index([accountingAssetCode])
  @@index([assetCostAccountCode])
  @@index([lifecycleStatus])
}

model AccountingAssetUsefulLife {
  id                     String   @id @default(cuid())
  versionId              String
  stableKey              String
  level1Ar               String
  level1En               String?
  level2Ar               String
  level2En               String?
  level3Ar               String
  level3En               String?
  capitalizationLimit    Float?
  capitalizationLimitRaw String?
  minimumUsefulLife      Float?
  maximumUsefulLife      Float?
  defaultUsefulLife      Float?
  lifecycleStatus        String?
  sourceRow              Int?
  createdAt              DateTime @default(now())

  version AccountingAssetClassificationVersion @relation(fields: [versionId], references: [id], onDelete: Cascade)

  @@unique([versionId, stableKey])
  @@index([versionId])
  @@index([level1Ar])
  @@index([level2Ar])
  @@index([level3Ar])
  @@index([lifecycleStatus])
}
'''
              schema_path.write_text(schema, encoding='utf-8')

          app_path = Path('src/app.js')
          app = app_path.read_text(encoding='utf-8')
          import_line = "import accountingAssetClassificationRoutes from './routes/accounting-asset-classification.routes.js';\n"
          anchor = "import accountingCyclesRoutes from './routes/accounting-cycles.routes.js';\n"
          if import_line not in app:
              if anchor not in app:
                  raise SystemExit('accounting cycles import anchor not found')
              app = app.replace(anchor, anchor + import_line, 1)

          mount = """app.use(\n  '/api/accounting-transformation/asset-classification',\n  requireAuth,\n  auditTrail('accounting_transformation'),\n  requirePermission('accounting_transformation'),\n  accountingAssetClassificationRoutes\n);\n\n"""
          mount_anchor = "app.use(\n  '/api/accounting-transformation/cycles',\n"
          if mount not in app:
              if mount_anchor not in app:
                  raise SystemExit('accounting transformation mount anchor not found')
              app = app.replace(mount_anchor, mount + mount_anchor, 1)
          app_path.write_text(app, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Verify JavaScript syntax
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Commit verified backend feature
        shell: bash
        run: |
          rm -f .github/workflows/apply-accounting-asset-classification.yml
          git config user.name "OpenAI Project Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma src/app.js src/routes/accounting-asset-classification.routes.js .github/workflows/apply-accounting-asset-classification.yml
          git commit -m "feat: add asset classification master data for accounting committee"
          git push origin HEAD:main

name: Apply accounting zero reset

on:
  push:
    branches:
      - feat/accounting-zero-reset

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/accounting-zero-reset
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply implementation
        run: python3 scripts/apply-accounting-zero-reset.py

      - name: Run backend tests
        run: npm test

      - name: Syntax verification
        run: |
          node --check src/routes/accounting-baseline-reset.routes.js
          node --check src/services/accountingCycles.service.js

      - name: Remove temporary implementation files
        run: |
          rm -f scripts/apply-accounting-zero-reset.py
          rm -f .github/workflows/apply-accounting-zero-reset.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
          else
            git commit -m "Add safe empty reset for accounting register [skip ci]"
            git push origin HEAD:feat/accounting-zero-reset
          fi

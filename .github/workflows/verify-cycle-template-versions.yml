name: Verify Cycle Template Versions

on:
  push:
    branches: [agent/cycle-specific-reports-template-versions]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema prisma
      - run: node --check src/services/accountingTemplateVersions.service.js
      - run: node --check src/routes/accounting-template-versions.routes.js
      - run: node --check src/routes/accounting-cycle-template.routes.js
      - run: node --check src/app.js

name: Apply Field Visit Treatment Evidence Validation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-field-visit-treatment-evidence-validation.py'
      - '.github/workflows/apply-field-visit-treatment-evidence-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python3 scripts/apply-field-visit-treatment-evidence-validation.py
      - run: npm ci
      - run: npx prisma generate
      - run: node --check src/routes/mosques.routes.js
      - name: Commit changes and clean temporary files
        run: |
          rm -f scripts/apply-field-visit-treatment-evidence-validation.py
          rm -f .github/workflows/apply-field-visit-treatment-evidence-validation.yml
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/mosques.routes.js scripts/apply-field-visit-treatment-evidence-validation.py .github/workflows/apply-field-visit-treatment-evidence-validation.yml
          git commit -m "Enforce treatment evidence on field visits"
          git push

name: Verify Smart Accounting Review Backend
on:
  push:
    branches: [agent/accounting-smart-review]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema prisma/schema.prisma
      - run: node --check src/routes/accounting-cycle-review-policy.routes.js
      - run: node --check src/app.js

name: Apply Quran Stock Reconciliation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-quran-stock-reconciliation.py'
      - '.github/workflows/apply-quran-stock-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/apply-quran-stock-reconciliation.py
      - run: npm ci
      - run: npx prisma generate
      - run: node --check src/routes/mosques.routes.js
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/mosques.routes.js
          git commit -m "Add Quran stock reconciliation totals"
          git push

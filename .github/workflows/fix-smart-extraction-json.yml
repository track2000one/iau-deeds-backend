name: Fix Smart Extraction JSON Output

on:
  push:
    paths:
      - 'scripts/fix-smart-extraction-json.cjs'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply smart extraction JSON fix
        run: node scripts/fix-smart-extraction-json.cjs
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Verify backend syntax
        run: node --check src/routes/assets.routes.js
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/assets.routes.js
          git commit -m "Fix smart extraction structured JSON output"
          git push origin HEAD:main

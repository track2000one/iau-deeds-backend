name: Apply Accounting Evidence Audit Backfill

on:
  push:
    branches: [feat/accounting-evidence-audit-backend]

permissions:
  contents: write

concurrency:
  group: accounting-evidence-audit-backfill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/accounting-evidence-audit-backend
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python3 scripts/apply-accounting-evidence-audit-backfill.py
      - run: npx prisma generate
      - run: node scripts/verify-accounting-evidence-audit-guard.mjs
      - name: Verify syntax
        run: |
          node --check src/services/accountingEvidenceAudit.service.js
          node --check src/server.js
          node --check src/routes/accounting-transformation.routes.js
          node --check src/routes/accounting-cycle-reimport.routes.js
      - name: Remove temporary files
        run: |
          rm -f scripts/apply-accounting-evidence-audit-backfill.py
          rm -f .github/workflows/apply-accounting-evidence-audit-backfill.yml
      - name: Commit changes
        run: |
          git config user.name "track2000one"
          git config user.email "track2000one@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "مزامنة سجل الإثبات التاريخي مع سجل العمليات"
            git push origin HEAD:feat/accounting-evidence-audit-backend
          fi

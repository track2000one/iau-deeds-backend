name: Apply Quran Rack Inventory V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-quran-rack-inventory-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Quran rack inventory backend
        shell: python
        run: |
          from pathlib import Path
          import re
          import textwrap

          legacy = Path('.github/workflows/apply-quran-rack-inventory.yml').read_text(encoding='utf-8')

          def extract(name):
              match = re.search(rf"{name} = r'''(.*?)'''", legacy, re.S)
              if not match:
                  raise SystemExit(f'Unable to extract {name} from legacy patch workflow')
              return textwrap.dedent(match.group(1)).strip('\n')

          rack_models = extract('rack_models')
          rack_code = extract('rack_code')

          schema_path = Path('prisma/schema.prisma')
          schema = schema_path.read_text(encoding='utf-8')
          if 'quranRackInventories MosqueQuranRackInventory[]' not in schema:
              marker = '  quranStockMovements MosqueQuranStockMovement[]\n'
              if marker not in schema:
                  raise SystemExit('MosqueSite quranStockMovements relation anchor not found')
              schema = schema.replace(marker, marker + '  quranRackInventories MosqueQuranRackInventory[]\n  quranRackMovements MosqueQuranRackMovement[]\n', 1)

          if 'model MosqueQuranRackInventory {' not in schema:
              marker = '\nmodel MosqueRequest {'
              if marker not in schema:
                  raise SystemExit('MosqueRequest model anchor not found')
              schema = schema.replace(marker, '\n\n' + rack_models + '\n\nmodel MosqueRequest {', 1)
          schema_path.write_text(schema, encoding='utf-8')

          route_path = Path('src/routes/mosques.routes.js')
          route = route_path.read_text(encoding='utf-8')
          if 'const quranRackInventorySchema = z.object({' not in route:
              marker = "router.post('/quran-inventory', requireRoles('head', 'supervisor', 'personnel'), async (req, res, next) => {"
              if marker not in route:
                  raise SystemExit('Quran inventory route anchor not found')
              route = route.replace(marker, rack_code + '\n\n' + marker, 1)
          route_path.write_text(route, encoding='utf-8')

      - name: Verify backend
        run: |
          npx prisma format
          npx prisma generate
          node --check src/routes/mosques.routes.js
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-quran-rack-inventory.yml .github/workflows/apply-quran-rack-inventory-v2.yml
          git add prisma/schema.prisma src/routes/mosques.routes.js
          git commit -m "Add Quran rack inventory and transfer ledger"
          git push origin HEAD:main

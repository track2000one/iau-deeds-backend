name: PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://validator:validator@localhost:5432/validator?schema=public
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Check JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/middleware/auth.js
          node --check src/routes/investment-sites.routes.js
          node --check src/routes/investment-areas.routes.js
          node --check src/routes/attachments.routes.js
          node --check src/routes/uploads.routes.js
      - name: Run tests
        run: npm test

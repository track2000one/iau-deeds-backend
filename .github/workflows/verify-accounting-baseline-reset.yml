name: Verify Accounting Baseline Reset Backend
on:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema prisma/schema.prisma
      - run: node --check src/services/accountingCycles.service.js
      - run: node --check src/routes/accounting-baseline-reset.routes.js
      - run: node --check src/app.js

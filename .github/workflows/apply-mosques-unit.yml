name: Apply Mosques Unit Backend

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-mosques-unit.cjs'
      - '.github/workflows/apply-mosques-unit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/apply-mosques-unit.cjs
      - run: npx prisma format
      - run: npx prisma generate
      - run: node --check src/routes/mosques.routes.js
      - run: node --check src/app.js
      - name: Commit backend module
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma src/app.js
          git commit -m "Integrate university mosques care module backend"
          git push

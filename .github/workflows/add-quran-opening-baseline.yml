name: Add Quran Opening Baseline Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/add-quran-opening-baseline.py'
      - '.github/workflows/add-quran-opening-baseline.yml'

permissions:
  contents: write

concurrency:
  group: add-quran-opening-baseline-backend
  cancel-in-progress: true

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply backend change
        run: python3 scripts/add-quran-opening-baseline.py

      - name: Install dependencies
        run: npm ci

      - name: Verify route syntax
        run: node --check src/routes/mosques.routes.js

      - name: Verify Prisma
        run: npx prisma validate

      - name: Commit verified backend source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/mosques.routes.js
          if git diff --cached --quiet; then
            echo "No backend source changes to commit"
            exit 0
          fi
          git commit -m "feat(mosques): add Quran opening baseline"
          git push origin main

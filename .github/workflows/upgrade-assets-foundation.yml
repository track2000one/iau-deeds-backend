name: Upgrade Asset Foundation

on:
  push:
    paths:
      - 'scripts/upgrade-assets-foundation.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply asset schema upgrade
        run: node scripts/upgrade-assets-foundation.mjs
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Commit upgraded asset schema
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "Expand asset data model and operations foundation"
          git push

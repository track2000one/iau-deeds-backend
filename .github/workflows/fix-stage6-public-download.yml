name: Fix Stage6 public download

on:
  push:
    branches: [fix/stage6-public-download]

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage6-public-download
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Patch Stage6 source reader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/services/accountingStage6Baseline.service.js')
          s=p.read_text()
          s=s.replace("import { google } from 'googleapis';\n", "")
          start=s.index('const getOAuthClient = () => {')
          end=s.index('\n\nconst columnName =', start)
          s=s[:start]+s[end+2:]
          old='''const readStage6Spreadsheet = async () => {\n  const drive = google.drive({ version: 'v3', auth: getOAuthClient() });\n  const response = await drive.files.get(\n    { fileId: ACCOUNTING_STAGE6_SOURCE.rawDriveFileId, alt: 'media' },\n    { responseType: 'arraybuffer' },\n  );\n  const buffer = Buffer.from(response.data);'''
          new='''const readStage6Spreadsheet = async () => {\n  // The reviewed workbook lives in the same Drive folder used by the platform and\n  // is shared read-only. Read the exact XLSX bytes through the public media endpoint\n  // rather than depending on an OAuth token whose drive.file scope may not include\n  // files created outside that OAuth grant. Integrity is still enforced by SHA-256.\n  const publicUrl = `https://drive.usercontent.google.com/download?id=${encodeURIComponent(ACCOUNTING_STAGE6_SOURCE.rawDriveFileId)}&export=download&confirm=t`;\n  const response = await fetch(publicUrl, { redirect: 'follow' });\n  if (!response.ok) {\n    throw new Error(`Unable to download reviewed Stage 6 workbook (HTTP ${response.status}). No accounting data was replaced.`);\n  }\n  const buffer = Buffer.from(await response.arrayBuffer());'''
          if old not in s:
              raise SystemExit('old reader block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify backend
        run: |
          npx prisma generate
          npm test
          node --check src/services/accountingStage6Baseline.service.js
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/fix-stage6-public-download.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/accountingStage6Baseline.service.js .github/workflows/fix-stage6-public-download.yml
          git commit -m 'Download reviewed Stage6 workbook via public Drive media [skip ci]'
          git push

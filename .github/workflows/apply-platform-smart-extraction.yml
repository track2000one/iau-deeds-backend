name: Apply Platform Smart Extraction

on:
  push:
    paths:
      - 'scripts/apply-platform-smart-extraction.cjs'
      - 'scripts/trigger-platform-smart-extraction.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply platform smart extraction patch
        run: node scripts/apply-platform-smart-extraction.cjs
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Verify route syntax
        run: node --check src/routes/assets.routes.js
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/assets.routes.js
          git commit -m "Generalize smart document extraction"
          git push origin HEAD:main

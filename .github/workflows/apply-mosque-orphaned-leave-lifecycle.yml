name: Apply Mosque Orphaned Leave Lifecycle

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-mosque-orphaned-leave-lifecycle.py'
      - '.github/workflows/apply-mosque-orphaned-leave-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply orphaned leave lifecycle fix
        run: python3 scripts/apply-mosque-orphaned-leave-lifecycle.py
      - name: Verify backend
        run: |
          npx prisma generate
          node --check src/routes/mosques.routes.js
          node --check src/services/mosqueLeaveLifecycle.service.js
          node --check src/server.js
      - name: Commit implementation and cleanup
        run: |
          rm -f scripts/apply-mosque-orphaned-leave-lifecycle.py .github/workflows/apply-mosque-orphaned-leave-lifecycle.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Fix orphaned mosque leave request lifecycle'
          git push

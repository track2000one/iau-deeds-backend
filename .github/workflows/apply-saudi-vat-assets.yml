name: Apply Saudi VAT Assets Backend

on:
  push:
    paths:
      - 'scripts/enable-saudi-vat-assets.cjs'
      - 'scripts/trigger-saudi-vat-assets.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Saudi VAT backend patch
        run: node scripts/enable-saudi-vat-assets.cjs
      - name: Install dependencies
        run: npm ci
      - name: Verify Prisma schema
        run: npx prisma generate
      - name: Verify backend syntax
        run: node --check src/routes/assets.routes.js
      - name: Commit generated backend changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma src/routes/assets.routes.js
          git commit -m "Add Saudi VAT calculation to asset records"
          git push origin HEAD:main

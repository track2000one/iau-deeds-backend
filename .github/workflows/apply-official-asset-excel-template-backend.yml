name: Apply Official Asset Excel Template Backend

on:
  push:
    paths:
      - 'scripts/apply-official-asset-excel-template-backend.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node scripts/apply-official-asset-excel-template-backend.mjs
      - run: npx prisma generate
      - run: node --check src/routes/assets.routes.js
      - run: node --check src/services/googleDrive.js
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma src/routes/assets.routes.js src/services/googleDrive.js
          git commit -m "Add official asset Excel template storage and download"
          git push origin HEAD:main

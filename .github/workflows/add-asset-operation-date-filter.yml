name: Add Asset Operation Date Filter

on:
  push:
    paths:
      - 'scripts/add-asset-operation-date-filter.cjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply asset report date filter patch
        run: node scripts/add-asset-operation-date-filter.cjs
      - name: Install dependencies
        run: npm ci
      - name: Verify backend syntax
        run: node --check src/routes/assets-fast.routes.js
      - name: Commit generated backend changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/assets-fast.routes.js
          git commit -m "Filter asset reports by data-entry date"
          git push origin HEAD:main

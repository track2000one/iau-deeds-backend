name: Apply Mosques Public Validation Fixes

on:
  push:
    branches: [fix/platform-audit-core]
    paths:
      - '.github/workflows/apply-mosques-public-validation-fixes.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/platform-audit-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply validation fixes
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_mosques_validation.py
          python3 /tmp/patch_mosques_validation.py
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Syntax check
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify validation invariants
        run: |
          grep -q "const publicTicketSchema" src/routes/mosques.routes.js
          grep -q "const publicJobSchema" src/routes/mosques.routes.js
          grep -q "رقم السجل المدني يجب أن يتكون من 10 أرقام" src/routes/mosques.routes.js
          grep -q "effectiveEnd < effectiveStart" src/routes/mosques.routes.js
      - name: Commit patched backend
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/mosques.routes.js
          git commit -m 'Validate mosque public forms and workflow dates'
          git push origin HEAD:fix/platform-audit-core

name: Apply Record Integrity Fixes

on:
  push:
    branches: [fix/platform-audit-core]
    paths:
      - '.github/workflows/apply-record-integrity-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/platform-audit-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/apply-record-integrity-fixes.mjs
      - run: npx prisma generate
      - run: node --check src/routes/deeds.routes.js
      - run: node --check src/routes/records.routes.js
      - name: Remove temporary patch files
        run: rm -f scripts/apply-record-integrity-fixes.mjs .github/workflows/apply-record-integrity-fixes.yml
      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/deeds.routes.js src/routes/records.routes.js scripts/apply-record-integrity-fixes.mjs .github/workflows/apply-record-integrity-fixes.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix Hijri deed dates and trusted audit identity"
            git push origin fix/platform-audit-core
          fi

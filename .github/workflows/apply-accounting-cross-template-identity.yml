name: Apply Accounting Cross Template Identity
on:
  push:
    branches: [agent/accounting-cross-template-identity]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/accounting-cross-template-identity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch stable-key canonicalization
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/services/accountingCycles.service.js')
          s = p.read_text()
          old = '''export const canonicalizeAccountingStableKey = (stableKey) => {
            const key = String(stableKey || '').trim();
            if (!key) return '';
            const strong = key.match(/^(?:land|building|fixed_asset|asset):(mof|entity):(.+)$/);
            if (strong) return `asset:${strong[1]}:${strong[2]}`;
            return key;
          };'''.replace('          ', '')
          new = '''const looksLikeStrongEntityAssetIdentity = (value) => {
            const normalized = normalizeIdentityPart(value);
            if (!normalized) return false;
            const compact = normalized.replace(/-/g, '');
            const digits = (compact.match(/\\d/g) || []).length;
            const latin = (compact.match(/[a-z]/gi) || []).length;
            if (digits >= 6) return true;
            return compact.length >= 10 && digits >= 4 && latin >= 2;
          };

          export const canonicalizeAccountingStableKey = (stableKey) => {
            const key = String(stableKey || '').trim();
            if (!key) return '';

            // Legacy building keys intentionally include physical discriminators because
            // labels such as A4 or villa names are often reused. When the entity number is
            // a strong identifier, remove those legacy-only discriminators so the same
            // asset can match a later Model B row even if the sheet/column layout changed.
            const buildingEntity = key.match(/^building:entity:([^:]+):([^:]+):(.+)$/);
            if (buildingEntity && looksLikeStrongEntityAssetIdentity(buildingEntity[2])) {
              return `asset:entity:${buildingEntity[1]}:${buildingEntity[2]}`;
            }

            const strong = key.match(/^(?:land|building|fixed_asset|asset):(mof|entity):(.+)$/);
            if (strong) return `asset:${strong[1]}:${strong[2]}`;
            return key;
          };'''.replace('          ', '')
          assert old in s, 'canonicalize function not found'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify syntax
        run: node --check src/services/accountingCycles.service.js
      - name: Commit changes
        run: |
          git config user.name "openai-codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/accountingCycles.service.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: reconcile strong asset identities across Excel templates"
          git push origin HEAD:agent/accounting-cross-template-identity

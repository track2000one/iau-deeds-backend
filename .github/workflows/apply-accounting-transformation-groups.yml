name: Apply Accounting Transformation Groups

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-accounting-transformation-groups.cjs'
      - '.github/workflows/apply-accounting-transformation-groups.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/apply-accounting-transformation-groups.cjs
      - run: npx prisma generate
      - run: node --check src/routes/accounting-transformation.routes.js
      - name: Commit grouping API
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/accounting-transformation.routes.js
          git commit -m "Add accounting transformation group summaries"
          git push

name: Vacant Lands Schema Safety

on:
  pull_request:
    paths:
      - 'prisma/schema.prisma'
      - '.github/workflows/vacant-lands-schema-safety.yml'
  push:
    branches:
      - feat/vacant-lands-registry-20261027
    paths:
      - 'prisma/schema.prisma'
      - '.github/workflows/vacant-lands-schema-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-additive-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate a read-only SQL diff against main
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
        run: |
          git show origin/main:prisma/schema.prisma > /tmp/iau-main-schema.prisma
          npx prisma migrate diff \
            --from-schema-datamodel /tmp/iau-main-schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --script > /tmp/vacant-land-schema-diff.sql
      - name: Block destructive and unrelated schema changes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const sql = fs.readFileSync('/tmp/vacant-land-schema-diff.sql', 'utf8');
          const statements = sql.split('\n').filter((line) => !line.trimStart().startsWith('--')).join('\n');
          console.log('Prisma schema diff (SQL statements only):\n' + statements.slice(0, 16000));
          const normalizedSql = statements.trim().replace(/\s+/g, ' ');
          // Carefully scoped exception: replace the *unique index*, not any rows
          // or columns. The new composite index must be created in the same diff.
          const expectedBuildingConstraintSwap =
            /^DROP INDEX "MosqueBuilding_buildingNumber_key"; CREATE UNIQUE INDEX "mosque_building_number_deed_key" ON "MosqueBuilding"\("buildingNumber", "deedId"\);?$/i;
          if (expectedBuildingConstraintSwap.test(normalizedSql)) {
            console.log('Approved exact MosqueBuilding index replacement: no data rows, tables or columns altered.');
            process.exit(0);
          }
          if (/(?:^|;)\s*(DROP|TRUNCATE|DELETE|UPDATE|RENAME)\b/im.test(statements)) {
            throw new Error('Destructive or data-changing SQL was detected. Manual review required.');
          }
          if (/CREATE TABLE\s+"VacantLand"/i.test(sql)) {
            // Preserve the original vacant lands guard: creation must not alter other existing tables.
            const changedExistingTables = [...sql.matchAll(/ALTER\s+TABLE\s+"([^"]+)"/gi)]
              .map((match) => match[1]).filter((name) => name !== 'VacantLand');
            if (changedExistingTables.length) {
              throw new Error('Unrelated tables modified: ' + changedExistingTables.join(', '));
            }
            console.log('VacantLand additive table creation verified.');
          } else {
            // Explicit, narrow allowance for the unrelated, optional building-documents schema extension.
            // Other unrelated schema changes still fail this check.
            const normalized = statements.trim().replace(/\s+/g, ' ');
            // Exact allowlist: the registration timestamp is optional,
            // does not rewrite existing rows and preserves createdAt.
            const allowed = [
              /^ALTER TABLE "MosqueBuilding" ADD COLUMN "documents" JSONB;?$/i,
              /^ALTER TABLE "MosqueBuilding" ADD COLUMN "registrationAt" TIMESTAMP\(3\);?$/i,
            ];
            if (!allowed.some((pattern) => pattern.test(normalized))) {
              throw new Error('Unexpected schema change: only approved nullable MosqueBuilding columns are allowed.');
            }
            console.log('Approved nullable MosqueBuilding column addition; no data rows or unrelated tables modified.');
          }
          console.log('Additive schema change only; backup and staging verification required.');
          NODE

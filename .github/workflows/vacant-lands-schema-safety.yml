name: Vacant Lands Schema Safety

on:
  pull_request:
    paths:
      - 'prisma/schema.prisma'
      - '.github/workflows/vacant-lands-schema-safety.yml'
  push:
    branches:
      - feat/vacant-lands-registry-20261027
    paths:
      - 'prisma/schema.prisma'
      - '.github/workflows/vacant-lands-schema-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-additive-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate a read-only SQL diff against main
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
        run: |
          git show origin/main:prisma/schema.prisma > /tmp/iau-main-schema.prisma
          npx prisma migrate diff \
            --from-schema-datamodel /tmp/iau-main-schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --script > /tmp/vacant-land-schema-diff.sql
      - name: Block destructive and unrelated schema changes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const sql = fs.readFileSync('/tmp/vacant-land-schema-diff.sql', 'utf8');
          const statements = sql.split('\n').filter((line) => !line.trimStart().startsWith('--')).join('\n');
          console.log('Prisma schema diff (SQL statements only):\n' + statements.slice(0, 16000));
          if (/(?:^|;)\s*(DROP|TRUNCATE|DELETE|UPDATE|RENAME)\b/im.test(statements)) {
            throw new Error('Destructive or data-changing SQL was detected. Manual review required.');
          }
          if (/CREATE TABLE\s+"VacantLand"/i.test(sql)) {
            // Preserve the original vacant lands guard: creation must not alter other existing tables.
            const changedExistingTables = [...sql.matchAll(/ALTER\s+TABLE\s+"([^"]+)"/gi)]
              .map((match) => match[1]).filter((name) => name !== 'VacantLand');
            if (changedExistingTables.length) {
              throw new Error('Unrelated tables modified: ' + changedExistingTables.join(', '));
            }
            console.log('VacantLand additive table creation verified.');
          } else {
            // Explicit, narrow allowance for the unrelated, optional building-documents schema extension.
            // Other unrelated schema changes still fail this check.
            const normalized = statements.trim().replace(/\s+/g, ' ');
            const allowlisted = /^ALTER TABLE "MosqueBuilding" ADD COLUMN "documents" JSONB;?$/i;
            if (!allowlisted.test(normalized)) {
              throw new Error('Expected VacantLand creation or the allowlisted optional MosqueBuilding.documents column only.');
            }
            console.log('Only nullable MosqueBuilding.documents added; VacantLand schema untouched.');
          }
          console.log('Additive schema change only; backup and staging verification required.');
          NODE

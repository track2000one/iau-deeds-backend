name: Apply Tour Owner Permissions

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-tour-owner-permissions.py'
      - '.github/workflows/apply-tour-owner-permissions.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply ownership policy
        run: python3 scripts/apply-tour-owner-permissions.py
      - name: Verify Prisma and backend syntax
        run: |
          npx prisma generate
          node --check src/routes/mosques.routes.js
      - name: Commit source change and cleanup
        run: |
          rm -f scripts/apply-tour-owner-permissions.py .github/workflows/apply-tour-owner-permissions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Enforce owner-only mosque tour editing'
          git push

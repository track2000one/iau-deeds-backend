name: Apply Prayer Room Gender

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-prayer-room-gender.py'
      - '.github/workflows/apply-prayer-room-gender.yml'

permissions:
  contents: write

concurrency:
  group: apply-prayer-room-gender-backend
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply patch
        run: python3 scripts/apply-prayer-room-gender.py

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/iau_deeds_validation
        run: npx prisma validate

      - name: Check backend syntax
        run: |
          node --check src/routes/mosques.routes.js
          node --check src/services/mosqueSites.service.js

      - name: Commit verified backend changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma src/routes/mosques.routes.js src/services/mosqueSites.service.js
          if git diff --cached --quiet; then
            echo "No backend source changes to commit"
            exit 0
          fi
          git commit -m "feat(mosques): add prayer-room gender"
          git push origin main

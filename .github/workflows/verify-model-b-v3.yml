name: Verify Model B v3 Backend
on:
  push:
    branches: [agent/model-b-fixed-assets-v3]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --check src/config/fixedAssetModelB.js
      - run: node --check src/config/accountingTransformation.js
      - run: node --check src/services/accountingCycles.service.js
      - run: node --check src/routes/accounting-cycles.routes.js
      - run: node --check src/routes/accounting-transformation.routes.js

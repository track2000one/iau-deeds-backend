name: Apply Field Owner Permissions V2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-field-owner-permissions-v2.py'
      - '.github/workflows/apply-field-owner-permissions-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply owner/head permission policy
        run: python3 scripts/apply-field-owner-permissions-v2.py
      - name: Verify backend syntax
        run: |
          npx prisma generate
          node --check src/routes/mosques.routes.js
      - name: Commit implementation and cleanup
        run: |
          rm -f scripts/apply-field-owner-permissions-v2.py .github/workflows/apply-field-owner-permissions-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Enforce owner-only field visit management with head override'
          git push

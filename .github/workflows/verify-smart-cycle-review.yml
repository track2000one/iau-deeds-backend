name: Verify Smart Accounting Review Policy

on:
  push:
    branches: [agent/smart-cycle-review-resolution]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --check src/routes/accounting-cycle-review-policy.routes.js
      - run: node --check src/app.js

name: Apply Asset Delete Fix

on:
  push:
    paths:
      - 'scripts/fix-asset-delete-archive-error.cjs'
      - 'scripts/trigger-asset-delete-fix.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply asset delete fix
        run: node scripts/fix-asset-delete-archive-error.cjs
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Verify route syntax
        run: node --check src/routes/assets.routes.js
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/assets.routes.js
          git commit -m "Fix asset deletion runtime error"
          git push origin HEAD:main

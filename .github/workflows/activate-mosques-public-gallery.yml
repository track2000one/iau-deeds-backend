name: Activate Mosque Public Gallery
on:
  push:
    branches: [main]
    paths:
      - 'scripts/activate-mosques-public-gallery.cjs'
      - '.github/workflows/activate-mosques-public-gallery.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/activate-mosques-public-gallery.cjs
      - run: npx prisma generate
      - run: node --check src/routes/mosques.routes.js
      - name: Commit backend gallery changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/mosques.routes.js
          git commit -m "Add public mosque slideshow gallery API"
          git pull --rebase origin main
          git push origin main

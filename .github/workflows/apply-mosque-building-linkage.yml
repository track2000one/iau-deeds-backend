name: Apply Mosque Building Coverage Linkage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mosque-building-linkage.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply building registry and site linkage
        run: node scripts/apply-mosque-building-linkage.mjs
      - name: Validate Prisma schema and JavaScript
        run: |
          npx prisma format
          npx prisma validate
          npx prisma generate
          node --check src/routes/mosques.routes.js
      - name: Commit implementation and cleanup
        run: |
          rm -f .github/workflows/apply-mosque-building-linkage.yml scripts/apply-mosque-building-linkage.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prisma/schema.prisma src/routes/mosques.routes.js .github/workflows/apply-mosque-building-linkage.yml scripts/apply-mosque-building-linkage.mjs
          git commit -m 'Add mosque building coverage registry and linkage'
          git push origin main

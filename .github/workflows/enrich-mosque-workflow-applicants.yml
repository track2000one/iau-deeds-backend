name: Enrich mosque workflow applicant details

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/enrich-mosque-workflow-applicants.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply backend changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/routes/mosques.routes.js')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "const MOSQUE_PERSONNEL_ROLE_LABELS = { imam: 'إمام', muezzin: 'مؤذن', khateeb: 'خطيب', collaborating_khateeb: 'خطيب متعاون', collaborator: 'خطيب متعاون' };\n",
              "const MOSQUE_PERSONNEL_ROLE_LABELS = { imam: 'إمام', muezzin: 'مؤذن', khateeb: 'خطيب', collaborating_khateeb: 'خطيب متعاون', collaborator: 'خطيب متعاون' };\nconst MOSQUE_MODULE_ROLE_LABELS = { head: 'رئيس الوحدة', supervisor: 'مشرف الوحدة', personnel: 'منسوب المسجد أو المصلى', university_member: 'منسوب الجامعة', viewer: 'منسوب الجامعة' };\n\nconst enrichMosqueApplicants = async (items, userField) => {\n  const userIds = [...new Set(items.map((item) => item?.[userField]).filter(Boolean))];\n  if (!userIds.length) return items.map((item) => ({ ...item, applicant: null }));\n\n  const [personnelRows, userRows, assignmentRows] = await Promise.all([\n    prisma.mosquePersonnel.findMany({\n      where: { userId: { in: userIds } },\n      select: { userId: true, name: true, role: true, mobile: true, email: true, active: true },\n    }),\n    prisma.appUser.findMany({\n      where: { id: { in: userIds } },\n      select: { id: true, username: true, email: true, role: true },\n    }),\n    prisma.mosqueUserAssignment.findMany({\n      where: { userId: { in: userIds } },\n      select: { userId: true, role: true, personnelRole: true },\n    }),\n  ]);\n\n  const personnelByUser = new Map(personnelRows.filter((row) => row.userId).map((row) => [row.userId, row]));\n  const userById = new Map(userRows.map((row) => [row.id, row]));\n  const assignmentByUser = new Map(assignmentRows.map((row) => [row.userId, row]));\n\n  return items.map((item) => {\n    const userId = item?.[userField];\n    if (!userId) return { ...item, applicant: null };\n    const personnel = personnelByUser.get(userId);\n    const user = userById.get(userId);\n    const assignment = assignmentByUser.get(userId);\n    const moduleRole = user?.role === 'admin' ? 'head' : normalizeMosqueRole(assignment?.role || 'university_member');\n    const personnelRole = personnel?.role || assignment?.personnelRole || null;\n    const roleLabel = personnelRole\n      ? (MOSQUE_PERSONNEL_ROLE_LABELS[personnelRole] || personnelRole)\n      : user?.role === 'admin'\n        ? 'مسؤول النظام'\n        : (MOSQUE_MODULE_ROLE_LABELS[moduleRole] || 'مستخدم');\n\n    return {\n      ...item,\n      applicant: {\n        userId,\n        name: personnel?.name || user?.username || 'مستخدم',\n        email: personnel?.email || user?.email || null,\n        mobile: personnel?.mobile || null,\n        role: personnelRole,\n        roleLabel,\n        moduleRole,\n        active: personnel?.active ?? true,\n      },\n    };\n  });\n};\n"
          )

          replace_once(
              "    const items = await prisma.mosqueRequest.findMany({ where, include: { site: { select: { name: true, siteType: true } } }, orderBy: { createdAt: 'desc' } });\n    res.json(items);",
              "    const items = await prisma.mosqueRequest.findMany({ where, include: { site: { select: { name: true, siteType: true } } }, orderBy: { createdAt: 'desc' } });\n    res.json(await enrichMosqueApplicants(items, 'submittedBy'));"
          )

          replace_once(
              "    res.json(await prisma.mosqueLeave.findMany({ where, include: { site: { select: { name: true } }, personnel: true }, orderBy: { createdAt: 'desc' } }));",
              "    const items = await prisma.mosqueLeave.findMany({ where, include: { site: { select: { name: true } }, personnel: true }, orderBy: { createdAt: 'desc' } });\n    res.json(await enrichMosqueApplicants(items, 'applicantUserId'));"
          )

          replace_once(
              "    const leave = await prisma.mosqueLeave.create({ data: { ...input, leaveNumber: trackingNumber('LEV'), applicantUserId: req.authUser.id } });",
              "    const applicantPersonnel = await prisma.mosquePersonnel.findFirst({\n      where: { userId: req.authUser.id, siteId: input.siteId, active: true },\n      select: { id: true },\n    });\n    const leave = await prisma.mosqueLeave.create({\n      data: { ...input, personnelId: applicantPersonnel?.id || null, leaveNumber: trackingNumber('LEV'), applicantUserId: req.authUser.id },\n    });"
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Syntax verification
        run: node --check src/routes/mosques.routes.js

      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name "OpenAI Project Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/mosques.routes.js
          git rm .github/workflows/enrich-mosque-workflow-applicants.yml
          git commit -m "feat: expose mosque workflow applicant details"
          git push

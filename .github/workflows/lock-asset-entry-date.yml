name: Lock Asset Entry Date

on:
  push:
    paths:
      - 'scripts/lock-asset-entry-date.cjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply immutable entry date safeguard
        run: node scripts/lock-asset-entry-date.cjs
      - name: Verify backend syntax
        run: node --check src/routes/assets.routes.js
      - name: Commit generated backend changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/assets.routes.js
          git commit -m "Keep asset first-entry date immutable"
          git push origin HEAD:main

name: Apply Mosque Site Media

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-mosque-site-media.mjs'
      - '.github/workflows/apply-mosque-site-media.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/apply-mosque-site-media.mjs
      - run: node --check src/routes/mosques.routes.js
      - run: node --check src/routes/uploads.routes.js
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/mosques.routes.js
          git commit -m "feat(mosques): support site photos and documents"
          git push

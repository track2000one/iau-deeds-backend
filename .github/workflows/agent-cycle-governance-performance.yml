name: Agent Cycle Governance Performance

on:
  push:
    branches:
      - agent/cycle-governance-performance

permissions:
  contents: write

concurrency:
  group: agent-cycle-governance-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cycle-governance-performance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node scripts/agent-cycle-governance-performance.mjs
      - run: npm ci
      - run: npx prisma generate
      - run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit applied source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "fix: harden update cycles and backend performance"
            git push origin HEAD:agent/cycle-governance-performance
          fi

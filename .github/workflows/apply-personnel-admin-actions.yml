name: Apply mosque personnel admin endpoints

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-personnel-admin-actions.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply backend changes
        run: |
          echo '' | base64 -d | gzip -d > /tmp/patch_personnel.py
          python3 /tmp/patch_personnel.py
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Syntax verification
        run: node --check src/routes/mosques.routes.js
      - name: Commit verified changes
        run: |
          rm -f .github/workflows/apply-personnel-admin-actions.yml
          git config user.name "OpenAI Project Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/mosques.routes.js .github/workflows/apply-personnel-admin-actions.yml
          git commit -m "feat: add mosque personnel admin endpoints"
          git push origin HEAD:main

name: Apply Accounting Evidence Audit Read API

on:
  push:
    branches: [feat/accounting-evidence-audit-read-api]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply evidence audit read API
        run: node scripts/apply-accounting-evidence-audit-read-api.mjs
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Verify JavaScript syntax
        run: node --check src/routes/accounting-transformation.routes.js
      - name: Verify route contract
        run: |
          grep -q "router.get('/evidence-audit-log'" src/routes/accounting-transformation.routes.js
          grep -q "entity: 'accounting_evidence_event'" src/routes/accounting-transformation.routes.js
          grep -q "readOnly: true" src/routes/accounting-transformation.routes.js
      - name: Remove temporary automation files
        run: rm -f scripts/apply-accounting-evidence-audit-read-api.mjs .github/workflows/apply-accounting-evidence-audit-read-api.yml
      - name: Commit integration changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Expose read-only accounting evidence audit mirror"
            git push origin HEAD:feat/accounting-evidence-audit-read-api
          fi

name: Enforce Quran Library Workflow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/enforce-quran-library-workflow.py'
      - '.github/workflows/enforce-quran-library-workflow.yml'

permissions:
  contents: write

concurrency:
  group: enforce-quran-library-workflow
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply patch
        run: python3 scripts/enforce-quran-library-workflow.py

      - name: Install dependencies
        run: npm ci

      - name: Verify backend syntax
        run: node --check src/routes/mosques.routes.js

      - name: Commit verified backend changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/mosques.routes.js
          if git diff --cached --quiet; then
            echo "No backend source changes to commit"
            exit 0
          fi
          git commit -m "refactor(mosques): enforce Quran library workflow"
          git push origin main

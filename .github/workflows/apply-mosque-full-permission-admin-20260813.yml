name: Apply Mosque Full Permission Admin 20260813
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-mosque-full-permission-admin-20260813.py'
      - '.github/workflows/apply-mosque-full-permission-admin-20260813.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python3 scripts/apply-mosque-full-permission-admin-20260813.py
      - run: npx prisma generate
      - run: node --check src/routes/mosques.routes.js
      - name: Commit mosque full-permission admin behavior
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/mosques.routes.js
          git commit -m "Grant full mosque permissions full unit administration"
          git restore --worktree .
          git pull --rebase origin main
          git push origin main

name: Apply land deed AJ AG identity

on:
  push:
    branches:
      - fix/land-aj-ag-one
    paths:
      - scripts/apply-land-deed-aj-ag-identity.py
      - .github/workflows/apply-land-deed-aj-ag-identity.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/land-aj-ag-one
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply implementation
        run: python3 scripts/apply-land-deed-aj-ag-identity.py

      - name: Run backend tests
        run: npm test

      - name: Syntax verification
        run: |
          node --check src/services/accountingCycles.service.js
          node --check src/routes/accounting-transformation.routes.js
          node --check src/routes/accounting-hierarchy.routes.js
          node --check src/routes/accounting-cycle-review-policy.routes.js

      - name: Remove temporary implementation files
        run: |
          rm -f scripts/apply-land-deed-aj-ag-identity.py
          rm -f .github/workflows/apply-land-deed-aj-ag-identity.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "Use AJ and AG as land deed identity [skip ci]"
          git push origin HEAD:fix/land-aj-ag-one

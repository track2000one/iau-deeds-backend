name: Apply Mosque Personnel Roles
on:
  push:
    branches: [main]
    paths:
      - 'scripts/add-mosque-personnel-roles.cjs'
      - '.github/workflows/apply-mosque-personnel-roles.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/add-mosque-personnel-roles.cjs
      - run: npx prisma format
      - run: npx prisma generate
      - run: node --check src/routes/mosques.routes.js
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/mosques.routes.js
          git commit -m "Link mosque user accounts to imam muezzin and khateeb roles"
          git restore --worktree .
          git pull --rebase origin main
          git push origin main

name: Add Field Visit Duplicate Guard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/add-field-visit-camera-duplicate-guard.py'
      - '.github/workflows/add-field-visit-camera-duplicate-guard.yml'

permissions:
  contents: write

concurrency:
  group: add-field-visit-duplicate-guard
  cancel-in-progress: true

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply duplicate guard
        run: python3 scripts/add-field-visit-camera-duplicate-guard.py
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Verify route syntax
        run: node --check src/routes/mosques.routes.js
      - name: Commit verified backend source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/mosques.routes.js
          if git diff --cached --quiet; then
            echo "No backend source changes to commit"
            exit 0
          fi
          git commit -m "feat(mosques): prevent duplicate active field visits"
          git push origin main

name: Security cleanup tracked generated files

on:
  push:
    paths:
      - '.github/workflows/security-cleanup-tracked-files.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove tracked generated and backup files
        run: |
          git rm -r --cached --ignore-unmatch node_modules
          git rm --ignore-unmatch prisma/schema.prisma.backup-*

      - name: Verify backend dependencies and syntax
        run: |
          npm ci
          npx prisma generate
          find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Commit cleanup
        run: |
          git config user.name 'OpenAI Project Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore .env.example
          git diff --cached --quiet && exit 0
          git commit -m 'security: remove tracked generated files and backups'
          git push origin main
